# `pre-commit install` wires these into git; CI runs the same gates.
repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: python3 -m ruff check --fix
        language: system
        types: [python]
        files: ^(packages|tests)/
      - id: black
        name: black
        entry: python3 -m black -q
        language: system
        types: [python]
        files: ^(packages|tests)/
      - id: mypy
        name: mypy
        entry: python3 -m mypy
        language: system
        pass_filenames: false
        files: ^packages/
