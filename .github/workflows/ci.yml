name: ci

# Supersedes tests.yml: lint + types, the test matrix (both supported Python
# and pandas majors), the coverage gate on model/ and tables/, and an
# acceptance job that reproduces the methodology's published anchors and the
# DEFAULT_YEARS window-invariance result -- all offline, from the committed
# cache fixtures. local/ is absent on CI, so grid-lookup tests skip by design;
# the analytical anchors (Tables 12-14 columns, alpha_FH, CCM*) do not.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
      - run: python -m ruff check packages tests services
      - run: python -m black --check packages tests services
      - run: python -m mypy

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
        pandas: ["pandas>=2,<3", "pandas>=3"]
    name: tests (py${{ matrix.python }}, ${{ matrix.pandas }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
          # The matrix axis is the ONLY package installed outside the files.
          pip install --upgrade "${{ matrix.pandas }}"
      - name: Suite with the model/tables coverage gate
        run: |
          python -m pytest -q \
            --cov=creditrating.model --cov=creditrating.tables \
            --cov=creditrating.diagnostics \
            --cov-report=term-missing:skip-covered \
            --cov-fail-under=85
      - name: Coverage summary
        if: always()
        run: |
          echo '## Coverage (model/, tables/, diagnostics/)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --skip-covered | tail -12 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt -c constraints.txt
      - name: Offline fixture batch (populates the cached panels)
        run: python -m mdt batch config/companies.yaml --workers 4
      - name: Panels present (the invariance tests must RUN, not skip)
        run: test -d data_cleaning/data/COST
      - name: Anchors and invariance
        # Tables 12-14 anchors (analytical route, no workbook needed),
        # alpha_FH(1.5)=0.91906, CCM*=1.35373, and the
        # DEFAULT_YEARS window-invariance result.
        run: |
          python -m pytest -q -rs \
            tests/test_measures.py tests/test_conversion.py \
            tests/test_window_invariance.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/terminal/package-lock.json
      - run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: vitest
        run: npm test
      - name: bundle safety (degraded without local/, stated in output)
        run: python3 scripts/check_bundle_safety.py
      - name: build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/terminal/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Playwright E2E + axe
        run: npx playwright test

  lighthouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/terminal/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Lighthouse >= 90 on perf/a11y/best-practices/SEO (desktop preset)
        # Desktop preset, declared: this is a desktop-class data terminal, and
        # the runner's 4x-throttled mobile emulation on GPU-less shared
        # hardware measures the runner (local mobile-emulated score: 96,
        # recorded in the DEVLOG). Median of three runs after a readiness
        # wait; reports upload as artifacts on failure.
        run: |
          npx serve out -l 4180 -n &
          until curl -sf http://localhost:4180/ > /dev/null; do sleep 0.5; done
          for path in "/" "/universe/" "/plane/" "/about/"; do
            for i in 1 2 3; do
              npx -y lighthouse "http://localhost:4180$path" \
                --preset=desktop \
                --chrome-flags="--headless=new --no-sandbox" \
                --output=json --output-path="./lh$i.json" --quiet
            done
            node -e "
              const runs = [1,2,3].map(i => require('./lh'+i+'.json'));
              const cats = ['performance','accessibility','best-practices','seo'];
              const med = a => [...a].sort((x,y)=>x-y)[1];
              const s = Object.fromEntries(cats.map(k => [k, med(runs.map(r => Math.round(r.categories[k].score*100)))]));
              const m = runs.map(r => 'LCP ' + r.audits['largest-contentful-paint'].displayValue + ' TBT ' + r.audits['total-blocking-time'].displayValue);
              console.log('$path scores', JSON.stringify(s));
              console.log('$path runs ', m.join(' | '));
              for (const [k,v] of Object.entries(s)) if (v < 90) { console.error(k, v, '< 90'); process.exit(1); }
            "
          done
      - name: Upload lighthouse reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: apps/terminal/lh*.json

  deploy:
    # Public GitHub Pages deploy -- only after EVERY other cell is green,
    # and the bundle-safety gate runs again in this job.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [lint, tests, acceptance, frontend, e2e, lighthouse]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: apps/terminal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/terminal/package-lock.json
      - run: npm ci
      - name: Bundle safety (deploy gate)
        run: python3 scripts/check_bundle_safety.py
      - name: Build with the project-pages base path
        env:
          NEXT_PUBLIC_BASE_PATH: /market-based-credit-rating
        run: npm run build
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/terminal/out
      - id: deployment
        uses: actions/deploy-pages@v4
