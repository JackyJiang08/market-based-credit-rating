[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "market-based-credit-rating"
version = "0.3.0"
description = "Market-based KMV/TiC credit-rating pipeline for public companies (EM asset estimation, PIT/TTC PD, S&P-equivalent rating)."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "JackyJiang08" }]
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=1.5",
    "numpy>=1.21",
    "scipy>=1.7",
    "openpyxl>=3.1",
    "requests>=2.28",
    "pyarrow>=15",
]

[project.scripts]
mdt = "mdt.__main__:main"

[tool.setuptools]
packages = [
    "raw_data_architecture",
    "data_cleaning",
    "signal_construction",
    "dashboard",
    "mdt",
]
py-modules = ["run"]
