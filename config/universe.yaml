# Expanded test universe: 150 US-listed names spanning the rating spectrum,
# deliberately including the hard cases ten hand-picked mega-caps never hit.
#
# Fields per entry:
#   ticker : exact Yahoo symbol
#   why    : why this name is in the list (the selection is the experiment)
#   agency : APPROXIMATE senior-unsecured agency rating (S&P scale) as of
#            mid-2026, from public sources, recorded for the distribution
#            comparison ONLY. Indicative, not authoritative; null = not rated
#            or not reliably known. Never an input to the model.
#
# Categories: IG mega-caps (anchors) · dual share class · negative book equity
# · banks/insurers/REITs (applicability gates) · utilities · energy ·
# healthcare · consumer · telecom/media · industrials · autos/EV · airlines,
# cruise & leisure (HY) · high-volatility/crypto-adjacent · recent IPOs (short
# history) · ADRs (foreign issuers, reporting-currency risk) · genuinely
# distressed · delisted/bankrupt (data-layer failure paths) · payment
# networks & asset managers (financial-sector classification edge).
